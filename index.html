```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Larry</title>

<style>
  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: white;
  }

  body {
    font-family: Arial, sans-serif;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }

  #scene {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #larry {
    position: relative;
    color: #222;
    font-size: clamp(70px, 14vw, 110px);
    font-weight: 400;
    letter-spacing: 2px;
    transform-origin: center center;
    cursor: grab;
    will-change: transform;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-font-smoothing: antialiased;
    padding: 18px 35px;
  }

  #larry:active {
    cursor: grabbing;
  }

  #hint {
    position: absolute;
    top: calc(50% + 110px);
    left: 50%;
    transform: translateX(-50%);
    font-size: 11px;
    color: #8d8d8d;
    opacity: 0;
    pointer-events: none;
    transition: opacity 1.4s ease;
  }

  #hint.show {
    opacity: 1;
  }

  #effects {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
  }

  .particle {
    position: absolute;
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: #555;
    opacity: 0;
    animation:
      particle 0.8s
      cubic-bezier(0.16, 1, 0.3, 1)
      forwards;
  }

  @keyframes particle {
    0% {
      opacity: 0.35;
      transform: translate(0, 0) scale(1);
    }

    100% {
      opacity: 0;
      transform: translate(var(--x), var(--y)) scale(0);
    }
  }

  #flash {
    position: absolute;
    inset: 0;
    background: white;
    pointer-events: none;
    opacity: 0;
  }

  #flash.active {
    animation: flash 0.3s ease-out;
  }

  @keyframes flash {
    0% {
      opacity: 0;
    }

    25% {
      opacity: 0.18;
    }

    100% {
      opacity: 0;
    }
  }

  #made {
    position: fixed;
    right: 8px;
    bottom: 6px;
    font-size: 8px;
    color: #aaa;
  }
</style>
</head>

<body>

<div id="scene">

  <div id="effects"></div>

  <div id="larry">
    Larry
  </div>

  <div id="hint">
    Hint: Drag the text to spin
  </div>

  <div id="flash"></div>

</div>

<div id="made">
  Made by LwOrks
</div>

<script>

/* =========================================================
   INVISIBLE VISITOR TRACKING
   ========================================================= */

let visitorId =
  sessionStorage.getItem("larryVisitorId");

if (!visitorId) {
  visitorId =
    crypto.randomUUID();

  sessionStorage.setItem(
    "larryVisitorId",
    visitorId
  );
}


/*
  Tell the server this visitor is online.
*/

async function heartbeat() {

  try {

    await fetch(
      "/api/heartbeat",
      {
        method: "POST",
        headers: {
          "Content-Type":
            "application/json"
        },

        body: JSON.stringify({
          id: visitorId
        }),

        keepalive: true
      }
    );

  } catch (error) {
    /*
      Tracking failure does NOT
      affect the website.
    */
  }

}


/*
  First connection.
*/

heartbeat();


/*
  Keep the visitor marked online.
*/

setInterval(
  heartbeat,
  10000
);


/*
  Tell the server when the
  browser is being closed.
*/

window.addEventListener(
  "pagehide",
  () => {

    navigator.sendBeacon(
      "/api/leave",

      JSON.stringify({
        id: visitorId
      })
    );

  }
);


/* =========================================================
   ORIGINAL LARRY WEBSITE
   ========================================================= */

const larry =
  document.getElementById("larry");

const hint =
  document.getElementById("hint");

const effects =
  document.getElementById("effects");

const flash =
  document.getElementById("flash");


let angle = 0;

let velocity = 0;

let dragging = false;

let lastPointerAngle = 0;

let lastTime = 0;

let lastInteraction =
  performance.now();

let hintShown = false;

let lastEffectTime = 0;

let lastFastFlash = 0;


function resetHintTimer() {

  lastInteraction =
    performance.now();

  hint.classList.remove("show");

}


function getPointerAngle(event) {

  const rect =
    larry.getBoundingClientRect();

  const centerX =
    rect.left +
    rect.width / 2;

  const centerY =
    rect.top +
    rect.height / 2;

  return Math.atan2(
    event.clientY - centerY,
    event.clientX - centerX
  );

}


function angleDifference(a, b) {

  let difference =
    a - b;

  while (
    difference > Math.PI
  ) {

    difference -=
      Math.PI * 2;

  }

  while (
    difference < -Math.PI
  ) {

    difference +=
      Math.PI * 2;

  }

  return difference;

}


function render() {

  larry.style.transform =
    `rotate(${angle}rad)`;

}


larry.addEventListener(
  "pointerdown",
  (event) => {

    dragging = true;

    resetHintTimer();

    larry.setPointerCapture(
      event.pointerId
    );

    lastPointerAngle =
      getPointerAngle(event);

    lastTime =
      performance.now();

    velocity *= 0.45;

  }
);


larry.addEventListener(
  "pointermove",
  (event) => {

    if (!dragging) return;

    resetHintTimer();

    const now =
      performance.now();

    const pointerAngle =
      getPointerAngle(event);

    const difference =
      angleDifference(
        pointerAngle,
        lastPointerAngle
      );

    const deltaTime =
      Math.max(
        now - lastTime,
        1
      );

    angle += difference;

    const measuredVelocity =
      difference /
      deltaTime *
      16;

    velocity =
      velocity * 0.78 +
      measuredVelocity * 0.22;

    velocity =
      Math.max(
        -0.58,
        Math.min(
          0.58,
          velocity
        )
      );

    lastPointerAngle =
      pointerAngle;

    lastTime =
      now;

    render();

    checkSpeed();

  }
);


function release() {

  if (!dragging) return;

  dragging = false;

  resetHintTimer();

}


larry.addEventListener(
  "pointerup",
  release
);

larry.addEventListener(
  "pointercancel",
  release
);


function physics() {

  if (!dragging) {

    angle += velocity;

    velocity *= 0.988;

    if (
      Math.abs(velocity) <
      0.00008
    ) {

      velocity = 0;

    }

    render();

    checkSpeed();

  }


  if (
    !dragging &&
    !hintShown &&
    performance.now() -
      lastInteraction >= 2000
  ) {

    hint.classList.add("show");

    hintShown = true;

  }


  requestAnimationFrame(
    physics
  );

}


function checkSpeed() {

  const speed =
    Math.abs(velocity);

  if (
    speed > 0.14 &&
    performance.now() -
      lastEffectTime > 100
  ) {

    createParticle();

    lastEffectTime =
      performance.now();

  }


  if (
    speed > 0.34 &&
    performance.now() -
      lastFastFlash > 1000
  ) {

    flash.classList.remove(
      "active"
    );

    void flash.offsetWidth;

    flash.classList.add(
      "active"
    );

    lastFastFlash =
      performance.now();

  }

}


function createParticle() {

  const particle =
    document.createElement("div");

  particle.className =
    "particle";

  const rect =
    larry.getBoundingClientRect();

  const centerX =
    rect.left +
    rect.width / 2;

  const centerY =
    rect.top +
    rect.height / 2;

  particle.style.left =
    centerX + "px";

  particle.style.top =
    centerY + "px";

  const distance =
    25 +
    Math.random() * 55;

  const randomAngle =
    Math.random() *
    Math.PI * 2;

  particle.style.setProperty(
    "--x",
    `${Math.cos(randomAngle) * distance}px`
  );

  particle.style.setProperty(
    "--y",
    `${Math.sin(randomAngle) * distance}px`
  );

  effects.appendChild(
    particle
  );

  setTimeout(
    () => particle.remove(),
    850
  );

}


physics();

</script>

</body>
</html>
